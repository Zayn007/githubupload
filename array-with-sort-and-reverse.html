<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array with sort & reverse</title>
</head>
<body>
    

    <script>
        let arey = ['ram','laxman','bharat','hanuman','vibhisan'];
        document.write(arey + "<br>");
        
        arey.sort();
        document.write(arey + "<br>");

        arey.reverse();
        document.write(arey + "<br>");



    </script>
</body>
</html>
