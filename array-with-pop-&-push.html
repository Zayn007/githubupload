<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documen with pop and push | js</title>
</head>
<body>
    

    <script>

        let aray = ['ram','laxman','bharat','hanuman','vibhisan'];

        document.write(aray + "<br>");

        aray.pop();
        document.write(aray + "<br>");

        aray.push("ravan",1000);
        document.write(aray + "<br>");
        



    </script>
</body>
</html>
