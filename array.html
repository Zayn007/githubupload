<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array with simple modification</title>
</head>
<body>
    

    <script>
         let ary = ['ducati','hayabusa','kawasaki','honda'];
         document.write(ary + "<br>");

         ary[3] = 'bmw';
         document.write(ary + "<br>");

         delete ary[1];
         document.write(ary + "<br>");
         
    </script>
</body>
</html>
